name: Build ARMv7 Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build inside ARMv7 Architecture
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}

          # Installieren Sie hier die Pakete, die Ihr Projekt zum Bauen benötigt
          install: |
            apt-get update
            apt-get install -y build-essential cmake git

          # Befehle, die nativ im ARMv7-Container ausgeführt werden
          run: |
            # -----------------------------------------------------------------
            # 1. IHREN ECHTEN BUILD-BEFEHL HIER AUSFÜHREN:
            # -----------------------------------------------------------------
            # Beispiele (zutreffendes einkommentieren / anpassen):
            #
            # Bei Makefile:
            # make
            #
            # Bei CMake:
            # cmake -B build -DCMAKE_BUILD_TYPE=Release
            # cmake --build build
            #
            # Bei direktem GCC-Aufruf:
            # gcc -O2 src/*.c -o mein_programm
            # -----------------------------------------------------------------

            # 2. Ordner für das Artefakt erstellen
            mkdir -p build_output

            # 3. Alle erzeugten Dateien in das Artefakt-Verzeichnis kopieren:
            # (Passen Sie die Quellpfade an den Ausgabeordner Ihres Projekts an)
            cp -r build/* build_output/ 2>/dev/null || cp mein_programm build_output/ 2>/dev/null || true

            # Optional: Konfigurationsdateien oder Skripte mitpacken
            # cp -r assets config.json build_output/ 2>/dev/null || true

            # 4. Kontrolle im Log: Was liegt im Artefakt-Ordner?
            echo "=== Inhalt von build_output ==="
            ls -laR build_output/

      - name: Alle Build-Dateien als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: armv7-build-files
          path: build_output/
          if-no-files-found: error
          retention-days: 7
