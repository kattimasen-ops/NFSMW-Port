name: Build ARMv7 NFSMW Port

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build on ARMv7
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update && apt-get install -y \
              build-essential \
              cmake \
              pkg-config \
              git \
              libsdl2-dev \
              libsdl2-image-dev \
              libsdl2-mixer-dev \
              libsdl2-ttf-dev \
              libgles2-mesa-dev \
              libopenal-dev \
              libvorbis-dev \
              libalut-dev
          run: |
            mkdir -p build
            cd build
            cmake -DENABLE_GLES2=ON ..
            make -j2
