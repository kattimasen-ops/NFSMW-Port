name: Build ARMv7 Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build inside ARMv7 Architecture
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}

          # Erstellt den Ausgabeordner im gemounteten Arbeitsverzeichnis auf dem Runner
          setup: |
            mkdir -p "${PWD}/build_output"

          install: |
            apt-get update
            apt-get install -y build-essential cmake git

          # Befehle im ARMv7-Container
          run: |
            echo "Starte Build..."
            
            # WICHTIG: Speichern Sie Ihre erzeugten Dateien in './build_output/'
            # Beispiel für einen echten Build: gcc main.c -o build_output/my-app
            echo "Dies ist eine kompilierte Test-Datei für ARMv7" > build_output/my-app.bin
            
            # Kontrollausgabe im Log
            ls -la build_output/

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: armv7-binary
          # Pfad zum Ordner oder der Datei auf dem Runner-Host
          path: build_output/
          # Bricht den Workflow ab, falls die Datei nicht existiert (verhindert stummes Fehlschlagen)
          if-no-files-found: error
          retention-days: 7
