name: Build ARMv7 NFSMW Port

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build on ARMv7
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update && apt-get install -y \
              ca-certificates \
              curl \
              gnupg \
              software-properties-common \
              build-essential \
              gcc \
              g++ \
              pkg-config \
              git \
              libsdl2-dev \
              libgles2-mesa-dev

            curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main" > /etc/apt/sources.list.d/kitware.list
            apt-get update && apt-get install -y cmake
          run: |
            mkdir -p build
            cd build
            cmake ..
            make -j2

            # 1. Ziel-Ordnerstruktur für ArkOS / NextOS erstellen
            mkdir -p ../dist/ports/nfsmw

            # 2. Kompiliertes Binary in den Unterordner kopieren
            cp nfs_mw_loader ../dist/ports/nfsmw/
            chmod +x ../dist/ports/nfsmw/nfs_mw_loader

            # Optional: Falls vorhanden, weitere Dateien wie z.B. Startskripte mitkopieren
            if [ -f "../NFS Most Wanted.sh" ]; then
              cp "../NFS Most Wanted.sh" ../dist/ports/
            fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Port-ARMv7
          path: dist/
          retention-days: 7
