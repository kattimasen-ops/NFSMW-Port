name: Build ARMv7 NFSMW Port

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build on ARMv7
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          install: |
            # 1. SSL-Zertifikate und Basis-Tools zuerst installieren
            apt-get update && apt-get install -y \
              ca-certificates \
              curl \
              gnupg \
              software-properties-common \
              build-essential \
              gcc \
              g++ \
              pkg-config \
              git \
              libsdl2-dev \
              libgles2-mesa-dev

            # 2. Kitware GPG-Schlüssel zuverlässig importieren
            curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg

            # 3. Repository eintragen und CMake aktualisieren
            echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main" > /etc/apt/sources.list.d/kitware.list
            apt-get update && apt-get install -y cmake
          run: |
            mkdir -p build
            cd build
            cmake ..
            make -j2
