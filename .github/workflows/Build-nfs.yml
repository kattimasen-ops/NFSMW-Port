name: Build ARMv7 Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    # Wichtig: Explizite Schreibrechte für die GitHub Container Registry (ghcr.io)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build inside ARMv7 Architecture
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          
          # Das Token wird für das Caching des Docker-Images in ghcr.io benötigt
          githubToken: ${{ secrets.GITHUB_TOKEN }}

          # Optional: Verzeichnisse aus dem Repository in den Container einbinden
          # setup: |
          #   mkdir -p "${PWD}/build_output"

          # Abhängigkeiten vor dem eigentlichen Build im ARM-Container installieren
          install: |
            apt-get update
            apt-get install -y build-essential cmake git

          # Umgebungsvariablen an den Container übergeben
          env: |
            BUILD_TYPE: Release

          # Befehle, die nativ/emuliert auf ARMv7 ausgeführt werden
          run: |
            echo "Starte Build auf ARMv7..."
            # Ersetzen Sie diese Zeilen durch Ihre Build-Befehle (z. B. make, cmake, cargo etc.):
            # cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
            # cmake --build build
            echo "Build erfolgreich beendet!"
