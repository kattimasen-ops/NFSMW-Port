name: Build NFS Most Wanted Mobile (RK3326 ARM32)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-armhf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build in Ubuntu 20.04 ARM32 Container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/build_output"
          run: |
            # 1. Systempakete für ARM32 installieren
            apt-get update
            apt-get install -y build-essential cmake libsdl2-dev libgles2-mesa-dev zip

            # 2. Hardware-Compiler-Flags für RK3326 (Cortex-A35 NEON)
            export CFLAGS="-O3 -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -ffast-math -fomit-frame-pointer"
            export CXXFLAGS="$CFLAGS"

            # 3. Projekt kompilieren
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc)

            # 4. PortMaster Release-Ordner aufbauen
            cd ..
            mkdir -p build_output/nfs_mw
            cp build/nfs_mw_loader build_output/nfs_mw/
            cp NFS_Most_Wanted.sh build_output/
            cp nfs_mw.gptk build_output/nfs_mw/
            
      - name: Package PortMaster ZIP Artifact
        run: |
          cd build_output
          zip -r ../NFS_Most_Wanted_PortMaster_RK3326.zip NFS_Most_Wanted.sh nfs_mw/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFS_Most_Wanted_PortMaster_RK3326
          path: NFS_Most_Wanted_PortMaster_RK3326.zip
