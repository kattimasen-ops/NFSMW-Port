name: Build fstat shim for ARM32 (RK3326 / ArkOS4clones, glibc 2.31)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Host-Runner: nur zum Starten des Containers noetig.
    runs-on: ubuntu-22.04

    # Der Job laeuft IM Container mit glibc 2.31.
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM32 cross-compiler toolchain (glibc 2.31)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            file \
            ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Verify toolchain and glibc version
        run: |
          arm-linux-gnueabihf-gcc --version
          echo "--- Host glibc version (soll 2.31 sein) ---"
          ldd --version | head -1
          echo "--- ARM32 libc version ---"
          arm-linux-gnueabihf-gcc -print-file-name=libc.so.6

      - name: Compile fstat shim against glibc 2.31
        run: |
          mkdir -p build
          arm-linux-gnueabihf-gcc \
            -shared \
            -fPIC \
            -O2 \
            -march=armv7-a \
            -mfpu=neon-vfpv4 \
            -mfloat-abi=hard \
            -Wl,-soname,libfstat_shim.so \
            -Wl,--version-script=src/fstat_shim.map \
            -o build/libfstat_shim.so \
            src/fstat_shim.c
          echo "--- Dateityp ---"
          file build/libfstat_shim.so
          echo "--- Dynamische Abhaengigkeiten ---"
          arm-linux-gnueabihf-readelf -d build/libfstat_shim.so | grep NEEDED || true
          echo "--- Exportierte Symbole ---"
          arm-linux-gnueabihf-nm -D build/libfstat_shim.so | grep -E ' fstat| fstat64' || true
          echo "--- Glibc-Symbolversionen (muss GLIBC_2.0 / GLIBC_2.1 sein) ---"
          arm-linux-gnueabihf-readelf --dyn-syms build/libfstat_shim.so | grep -E 'fstat|__fxstat' || true

      - name: Upload shim as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfstat_shim-arm32-glibc231
          path: build/libfstat_shim.so
          if-no-files-found: error
