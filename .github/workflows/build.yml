name: Build ArkOS Port Artifact

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Kompilierung in ARMv7-Emulation
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          run: |
            # Systempakete & Header-Dateien installieren
            apt-get update
            apt-get install -y build-essential libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev zip

            # Loader kompilieren
            make clean
            make

            # ArkOS-Ordnerstruktur korrekt aufbauen
            mkdir -p release/ports/nfs_mw/libs
            mkdir -p release/ports/nfs_mw/gamedata
            
            # Binary & Zubehör in den Hauptordner kopieren
            cp nfs_loader release/ports/nfs_mw/
            [ -f loader.c ] && cp loader.c release/ports/nfs_mw/
            [ -f Makefile ] && cp Makefile release/ports/nfs_mw/
            [ -f nfs_mw.gptk ] && cp nfs_mw.gptk release/ports/nfs_mw/

            # Alle vorhandenen .so Dateien in den libs-Ordner verschieben
            cp *.so release/ports/nfs_mw/libs/ 2>/dev/null || true
            if [ -d libs ]; then cp -r libs/* release/ports/nfs_mw/libs/ 2>/dev/null || true; fi

            # Alle .sh Skripte aus dem Hauptverzeichnis nach release/ports/ kopieren
            cp *.sh release/ports/ 2>/dev/null || echo "Keine .sh Datei im Root gefunden!"

            # ZIP-Archiv erstellen
            cd release
            zip -r ../NFS_Most_Wanted_ArkOS.zip ports/

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NFS_Most_Wanted_ArkOS
          path: NFS_Most_Wanted_ArkOS.zip
          retention-days: 30
