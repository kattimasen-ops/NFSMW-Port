name: Build ArkOS Port Artifact

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Kompilierung in ARMv7-Emulation
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          run: |
            apt-get update
            apt-get install -y build-essential libsdl2-dev \
              libegl1-mesa-dev libgles2-mesa-dev zip binutils

            make clean
            make

            mkdir -p release/ports/nfs_mw/libs
            mkdir -p release/ports/nfs_mw/gamedata
            touch release/ports/nfs_mw/libs/.gitkeep
            touch release/ports/nfs_mw/gamedata/.gitkeep

            echo "Hier alle .so Dateien hineinkopieren (libNFSMW.so, libc++_shared.so etc.)" \
              > release/ports/nfs_mw/libs/HIER_LIBS_REINKOPIEREN.txt
            echo "Hier die entpackten OBB-Ordner hineinkopieren (images, published, sound, TRACKS)" \
              > release/ports/nfs_mw/gamedata/HIER_GAMEDATA_REINKOPIEREN.txt

            if [ -d libs ]; then cp -r libs/* release/ports/nfs_mw/libs/ 2>/dev/null || true; fi
            if [ -d gamedata ]; then cp -r gamedata/* release/ports/nfs_mw/gamedata/ 2>/dev/null || true; fi
            cp *.so release/ports/nfs_mw/libs/ 2>/dev/null || true

            cp nfs_loader release/ports/nfs_mw/
            [ -f loader.c ] && cp loader.c release/ports/nfs_mw/
            [ -f Makefile ] && cp Makefile release/ports/nfs_mw/
            [ -f nfs_mw.gptk ] && cp nfs_mw.gptk release/ports/nfs_mw/

            cp *.sh release/ports/ 2>/dev/null || echo "Keine .sh Datei im Root!"

            cd release
            zip -r9 ../NFS_Most_Wanted_ArkOS.zip ports/

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NFS_Most_Wanted_ArkOS
          path: NFS_Most_Wanted_ArkOS.zip
          retention-days: 30
